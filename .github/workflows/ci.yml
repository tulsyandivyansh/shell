name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC
            cc: gcc
            cxx: g++
          - name: Clang
            cc: clang
            cxx: clang++
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libreadline-dev ninja-build
      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: >-
          cmake -S . -B build/ci -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=ON
          -DENABLE_WERROR=ON
      - name: Build
        run: cmake --build build/ci --parallel
      - name: Test
        run: ctest --test-dir build/ci --output-on-failure

  sanitizers:
    name: ASan + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libreadline-dev ninja-build clang
      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: >-
          cmake -S . -B build/sanitizers -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=ON
          -DENABLE_SANITIZERS=ON
          -DENABLE_WERROR=ON
      - name: Build
        run: cmake --build build/sanitizers --parallel
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build/sanitizers --output-on-failure

  fuzz-smoke:
    name: libFuzzer smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang
      - name: Configure fuzzer
        env:
          CC: clang
          CXX: clang++
        run: >-
          cmake -S . -B build/fuzz -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=OFF
          -DENABLE_FUZZING=ON
          -DBUILD_SHELL=OFF
      - name: Build fuzzer
        run: cmake --build build/fuzz --target parser_fuzzer --parallel
      - name: Run bounded fuzz campaign
        run: ./build/fuzz/parser_fuzzer -runs=20000 -max_len=512
